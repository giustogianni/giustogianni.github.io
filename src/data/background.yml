paragraphs:
  - text: >
      I'm a Data & AI Engineer based in Switzerland with a MSc degree in Life Sciences
      Engineering and Data Science from [EPFL](https://www.epfl.ch/en/). My work sits at the
      intersection of data infrastructure and applied AI — building reliable pipelines,
      integrating heterogeneous data sources, and translating raw data into decisions that
      matter to the business.
  - text: >
      Outside of work, I spend most of my time trail running in the Alps or exploring what's
      possible with the latest developments in machine learning and cloud-native tooling. I care
      about systems that are simple, observable, and built to last.
